[theme]
base = "light"
primaryColor = "#1D6F52"
backgroundColor = "#F3F6F3"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#17211E"
linkColor = "#165A42"
borderColor = "#D3DDD7"
showWidgetBorder = true
baseRadius = "medium"
baseFontSize = 18
font = "Atkinson Hyperlegible Next, sans-serif"
headingFont = "Atkinson Hyperlegible Next, sans-serif"
codeFont = "Atkinson Hyperlegible Mono, monospace"
dataframeHeaderBackgroundColor = "#E2F0E9"

[[theme.fontFaces]]
family = "Atkinson Hyperlegible Next"
url = "https://fonts.gstatic.com/s/atkinsonhyperlegiblenext/v7/NaPNcYPdHfdVxJw0IfIP0lvYFqijb-UxCtm5_wdGseiJn3q0pkZ_.woff2"
weight = "200 800"

[[theme.fontFaces]]
family = "Atkinson Hyperlegible Mono"
url = "https://fonts.gstatic.com/s/atkinsonhyperlegiblemono/v8/tss4AoFBci4C4gvhPXrt3wjT1MqSzhA4t7IIcncBiwKthFyDHi0j.woff2"
weight = "400 700"

[theme.sidebar]
backgroundColor = "#12352E"
secondaryBackgroundColor = "#1C4A40"
textColor = "#F1F6F3"
primaryColor = "#6FD3A8"
borderColor = "#3C6B5F"
